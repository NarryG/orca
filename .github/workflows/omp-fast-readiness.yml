name: OMP minimal baseline attribution
on:
  push:
    branches:
      - validation/omp-fast-readiness-d0d3edd0f8-ubuntu
permissions:
  contents: read
jobs:
  compare-existing-contracts:
    name: Existing contracts (${{ matrix.source.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source:
          - name: untouched-baseline
            sha: 51530bb86cb2f799fb5162840654c64d9ff48fb2
          - name: fast-minimal
            sha: 9e2ca463e74670a440e476f5c5352414d84a45fa
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24.21.0'
          cache-electron-package: 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
      - name: Compare unchanged Node contracts
        run: pnpm test:node src/main/emulator/serve-sim-kill-contract.test.ts src/main/daemon/daemon-init-provider-installation.test.ts --maxWorkers=1
